name: Build check

# Compiles PlayCover (and the PlayTools framework it embeds) with several Xcode / macOS versions.
# macOS 27 / Xcode 27 is not offered by GitHub-hosted runners yet: add a matrix entry
# (runner: macos-27, xcode: "27.x") once it is, or run this on a self-hosted macOS 27 runner.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 Sequoia / Xcode 16.4
            runner: macos-15
            xcode: "16.4"
          - name: macOS 26 Tahoe / Xcode 26.6
            runner: macos-26
            xcode: "26.6"
          # Tahoe SDK on the macos-15 image, which also ships Xcode 26 and is usually easier to get a runner for
          - name: macOS 26 SDK / Xcode 26.3 (macos-15 runner)
            runner: macos-15
            xcode: "26.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Install dependencies
        run: brew install carthage swiftlint

      - name: Build PlayTools
        run: carthage update --use-xcframeworks

      - name: Build PlayCover (Release, ad-hoc signed)
        # DerivedData lives outside the checkout so the SwiftLint build phase does not lint package sources
        run: |
          xcodebuild -scheme PlayCover -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_HARDENED_RUNTIME=NO \
            build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u; tail -n 40 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/build.log"

      - name: Smoke test the command line interface
        run: |
          PC="$RUNNER_TEMP/DerivedData/Build/Products/Release/PlayCover.app/Contents/MacOS/PlayCover"
          "$PC" version
          "$PC" help > /dev/null
          "$PC" devices
          "$PC" list --json
